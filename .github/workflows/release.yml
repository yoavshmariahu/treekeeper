# Publishes to npm on a version tag, using npm trusted publishing (OIDC).
#
# There is deliberately no NPM_TOKEN here. The `id-token: write` permission
# below lets npm verify this exact workflow against the trusted publisher
# configured on the package, and provenance is attached automatically — adding
# `--provenance` is unnecessary.
#
# One-time setup on npmjs.com, under the package's Settings -> Trusted
# Publisher (see RELEASING.md):
#   Organization or user: yoavshmariahu
#   Repository:           treekeeper
#   Workflow filename:    release.yml
#   Allowed actions:      npm publish
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # required for OIDC; this is what replaces the token
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Refuse to publish a tag that disagrees with package.json.
      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
      - run: npm publish
