name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22", "24"]
        exclude:
          - os: macos-latest
            node: "20"
          - os: macos-latest
            node: "22"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The CLI has to work from a clean build, not just in tests.
      - run: node dist/cli.js --version
      - run: node dist/cli.js doctor || true
      - run: node dist/cli.js gc . --json
