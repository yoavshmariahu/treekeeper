name: Something was removed that should have been kept
description: treekeeper deleted a worktree or branch that was not finished
labels: [bug, safety]
body:
  - type: markdown
    attributes:
      value: >
        **Recover first, report second.** Every removal is archived before it happens.
        Run `treekeeper archive list` to find it, then follow the `RESTORE.md` inside
        the archive directory — it contains the exact commands to bring the branch,
        the worktree and any uncommitted diff back.
  - type: textarea
    id: what
    attributes:
      label: What was removed
      description: The worktree path and branch name, and why it was not finished.
    validations:
      required: true
  - type: textarea
    id: record
    attributes:
      label: The log entry and archive record
      description: >
        The matching lines from `~/.treekeeper/treekeeper.log`, and the `meta.json`
        from the archive directory. Together these show which rule fired.
      render: json
    validations:
      required: true
  - type: textarea
    id: recovered
    attributes:
      label: Was the work recoverable from the archive?
      description: If not, say what was missing — that is a separate and more serious bug.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Your `~/.treekeeper/config.json` and any repo-level `.treekeeper.json`, plus the flags you ran with.
      render: json
